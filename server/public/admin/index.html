<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>TouchBite Merchant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="login-view" class="view">
    <form id="login-form" class="login-card" autocomplete="off">
      <div class="brand"><span class="brand__mark">T</span> TouchBite <b>Merchant</b></div>
      <h1>Sign in</h1>
      <p class="muted">This dashboard is restricted to TouchBite staff.</p>
      <label>Email<input type="email" id="email" required autocomplete="username" /></label>
      <label>Password<input type="password" id="password" required autocomplete="current-password" /></label>
      <button type="submit">Sign in</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </div>

  <div id="dashboard-view" class="view" hidden>
    <header class="topbar">
      <div class="brand"><span class="brand__mark">T</span> TouchBite <b>Merchant</b></div>
      <div class="topbar__right">
        <span id="connection-dot" class="dot"></span>
        <span id="connection-label" class="muted">Connecting…</span>
        <span id="admin-email" class="muted"></span>
        <button id="logout" class="ghost-button">Sign out</button>
      </div>
    </header>

    <main>
      <div class="tabs">
        <button class="tab active" data-status="">All active</button>
        <button class="tab" data-status="received">Received</button>
        <button class="tab" data-status="preparing">Preparing</button>
        <button class="tab" data-status="ready">Ready</button>
        <button class="tab" data-status="completed">Completed</button>
      </div>
      <div id="order-list" class="order-grid"></div>
      <p id="empty-state" class="muted empty-state" hidden>No orders here yet.</p>
    </main>
  </div>

  <template id="order-card-template">
    <article class="order-card">
      <header>
        <span class="order-number"></span>
        <span class="order-status-pill"></span>
      </header>
      <ul class="order-items"></ul>
      <div class="order-meta">
        <span class="order-type"></span>
        <span class="order-total"></span>
      </div>
      <div class="order-actions"></div>
      <time class="order-time"></time>
    </article>
  </template>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
